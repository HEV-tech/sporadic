    />
    <script>
      // Тема ставится до первой отрисовки, чтобы не было вспышки.
      // По умолчанию сайт открывается листом; ночной чертёж — только по выбору.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('sporadic-theme') || '{}')
          var theme = saved.theme === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
